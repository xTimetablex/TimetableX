name: Deploy

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run test

  react-doctor:
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: millionco/react-doctor@v2

  deploy:
    needs: [test, react-doctor]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://timetablex.space
            NEXT_PUBLIC_SENTRY_DSN=https://c08cdaa0d0cd0eb1a55090420e45894d@o4512233973350400.ingest.de.sentry.io/4512414118051921
            NEXT_PUBLIC_POSTHOG_KEY=phc_TZ1ZS5hc7g3GXcT2z8uX63IP9azUaBCf2SFolV7aTct
            SENTRY_RELEASE=${{ github.ref_name }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      # Production runs on Openship (project "TimetableX"), which tracks GitHub
      # Releases and deploys ghcr.io/xtimetablex/timetablex:{tag}. Openship
      # doesn't redeploy on its own when a release is published, so this calls
      # the project's incoming "deploy" webhook once the image exists.
      - name: Trigger Openship deploy
        env:
          HOOK_URL: ${{ secrets.OPENSHIP_DEPLOY_HOOK_URL }}
          HOOK_TOKEN: ${{ secrets.OPENSHIP_DEPLOY_HOOK_TOKEN }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-all-errors --max-time 60 \
            -X POST -H "Authorization: Bearer $HOOK_TOKEN" "$HOOK_URL"
