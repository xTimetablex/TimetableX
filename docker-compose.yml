services:
  web:
    image: ghcr.io/xtimetablex/timetablex:latest
    restart: unless-stopped
    env_file: .env
    networks:
      - caddy-public

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    command: --interval 60 --cleanup web
    networks:
      - caddy-public

networks:
  caddy-public:
    external: true
